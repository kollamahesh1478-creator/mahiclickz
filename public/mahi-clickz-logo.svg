<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%" className="overflow-visible">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="25%" stop-color="#E2B13C" />
      <stop offset="50%" stop-color="#FFF2A8" />
      <stop offset="75%" stop-color="#B28228" />
      <stop offset="100%" stop-color="#E5BA4B" />
    </linearGradient>

    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="50%" stop-color="#D9A833" />
      <stop offset="100%" stop-color="#8F5E12" />
    </linearGradient>

    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FFF0A0" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Chrome / Silver Metallic Gradients for CLICKZ -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="chromeLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A0AEC0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradients -->
    <radialGradient id="lensGlassGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0369A1" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#4F46E5" />
      <stop offset="95%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <radialGradient id="lensCoreReflection" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <linearGradient id="lensFlareGlare" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="chromeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94A3B8" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Left Side: MAHI CLICKZ Text -->
  <g id="brand-text" filter="url(#goldGlow)">
    
    <!-- MAHI Typography (3D Gold Bevel) -->
    <!-- M -->
    <path d="M 50 200 L 50 90 L 75 90 L 105 155 L 135 90 L 160 90 L 160 200 L 135 200 L 135 130 L 115 175 L 95 175 L 75 130 L 75 200 Z" 
          fill="url(#goldBevelGrad)" stroke="#FFE885" stroke-width="1.5" />
    
    <!-- A (Geometric Chevron apex) -->
    <path d="M 195 200 L 245 90 L 270 90 L 320 200 L 290 200 L 257 122 L 225 200 Z" 
          fill="url(#goldBevelGrad)" stroke="#FFE885" stroke-width="1.5" />

    <!-- H -->
    <path d="M 345 90 L 372 90 L 372 133 L 438 133 L 438 90 L 465 90 L 465 200 L 438 200 L 438 157 L 372 157 L 372 200 L 345 200 Z" 
          fill="url(#goldBevelGrad)" stroke="#FFE885" stroke-width="1.5" />

    <!-- I -->
    <path d="M 495 90 L 522 90 L 522 200 L 495 200 Z" 
          fill="url(#goldBevelGrad)" stroke="#FFE885" stroke-width="1.5" />

    <!-- CLICKZ Typography (3D Chrome Silver Bevel) -->
    <g filter="url(#chromeGlow)">
      <!-- C -->
      <path d="M 105 235 L 75 235 Q 50 235 50 262 L 50 278 Q 50 305 75 305 L 105 305 L 105 285 L 75 285 Q 70 285 70 278 L 70 262 Q 70 255 75 255 L 105 255 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- L -->
      <path d="M 130 235 L 150 235 L 150 285 L 180 285 L 180 305 L 130 305 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- I -->
      <path d="M 205 235 L 225 235 L 225 305 L 205 305 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- C -->
      <path d="M 290 235 L 260 235 Q 235 235 235 262 L 235 278 Q 235 305 260 305 L 290 305 L 290 285 L 260 285 Q 255 285 255 278 L 255 262 Q 255 255 260 255 L 290 255 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- K -->
      <path d="M 315 235 L 335 235 L 335 262 L 360 235 L 385 235 L 350 270 L 385 305 L 360 305 L 335 278 L 335 305 L 315 305 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />

      <!-- Z -->
      <path d="M 405 235 L 455 235 L 455 255 L 428 285 L 455 285 L 455 305 L 405 305 L 405 285 L 432 255 L 405 255 Z" 
            fill="url(#chromeGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    </g>
  </g>

  <!-- Right Side: Luxury Gold Camera with Optical Lens -->
  <g id="camera-insignia" filter="url(#goldGlow)">
    
    <!-- Top Flash/Shutter Button -->
    <path d="M 585 95 L 635 95 L 640 105 L 580 105 Z" fill="url(#goldBevelGrad)" />

    <!-- Gold Camera Body Contour -->
    <path d="M 560 140 
             Q 560 120 580 120 
             L 645 120 
             Q 660 120 670 100 
             Q 675 90 690 90 
             L 770 90 
             Q 785 90 790 100 
             Q 800 120 815 120 
             L 820 120 
             Q 840 120 840 140 
             L 840 270 
             Q 840 290 820 290 
             L 760 290 
             M 640 290 
             L 580 290 
             Q 560 290 560 270 
             Z" 
          fill="none" 
          stroke="url(#goldBorderGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Lens Outer Gold Bezel -->
    <circle cx="700" cy="205" r="88" fill="#0B0D10" stroke="url(#goldBorderGrad)" stroke-width="10" />
    <circle cx="700" cy="205" r="76" fill="#111827" stroke="url(#goldLightGrad)" stroke-width="4" />
    
    <!-- Lens Ridges / Aperture Texture -->
    <circle cx="700" cy="205" r="67" fill="#020617" stroke="#1E293B" stroke-width="3" />
    <circle cx="700" cy="205" r="60" fill="url(#lensGlassGrad)" />
    
    <!-- Multi-Coating Lens Optics -->
    <circle cx="700" cy="205" r="46" fill="url(#lensCoreReflection)" />
    <circle cx="700" cy="205" r="28" fill="#030712" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <circle cx="700" cy="205" r="12" fill="#0284C7" />
    <circle cx="700" cy="205" r="4" fill="#FFFFFF" />

    <!-- Realistic Glass Arc Flare Reflection -->
    <path d="M 645 175 A 65 65 0 0 1 735 150" fill="none" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 660 250 A 60 60 0 0 0 745 240" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
